[project]
name = "writing-markdown"
version = "0.1.0"
description = "Markdownlint and ASCII hygiene guides and auto-fixers."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "D",
    "BLE",
    "PLW",
    "ERA001",
]
ignore = [
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["D100", "D101", "D102", "D103"]
