[project]
name = "agent-skills"
version = "0.1.0"
description = "Repository of reusable AI coding agent skills across Google Antigravity and Anthropic Claude Code."
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "D",
    "BLE",
    "PLW",
    "ERA001",
]
ignore = [
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["D100", "D101", "D102", "D103"]
